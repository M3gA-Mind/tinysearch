[package]
name = "tinysearch-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The TinyBus wire contract for the TinySearch module: member names, payload types, and the contract version."
documentation = "https://docs.rs/tinysearch-bus"
readme = "README.md"
keywords = ["tinybus", "module", "contract", "search"]
categories = ["development-tools"]
publish = false

# Deliberately dependency-light: this is the crate a host links to talk to the
# loadable module, so it must cost that host almost nothing. Nothing here may
# pull in `tinybus`, an async runtime, an HTTP client, or a native library —
# see `src/lib.rs` for why the transport in particular is absent. CI asserts it.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Off by default: a host that only makes calls should not pay for it.
schemars = { workspace = true, optional = true }

[features]
default = []
# Derive `JsonSchema` on `ProviderRoute`, `PresentationMode` and `Role`.
schemars = ["dep:schemars"]

[lints]
workspace = true
