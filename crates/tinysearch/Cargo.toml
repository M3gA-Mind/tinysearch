[package]
name = "tinysearch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A TinyBus web search module."
documentation = "https://docs.rs/tinysearch"
readme = "../../README.md"
keywords = ["tinybus", "module", "plugin", "search"]
categories = ["development-tools"]
publish = false

[lib]
# Keep the ordinary Rust library for tests and downstream reuse while also
# producing the native module artifact that TinyBus loads at runtime.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The wire contract: member names, payload types, and the contract version.
# Re-exported wholesale from `src/lib.rs` so a consumer takes one dependency
# rather than two, and so `tinysearch::ToolSpec` and
# `tinysearch_bus::ToolSpec` are the same type.
tinysearch-bus = { workspace = true }
tinybus = { workspace = true }
tinybus-module = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Direct-provider regression fixtures verify real HTTP requests without live services.
wiremock = "0.6"
# Shared loader, broker, and typed-call helpers for native module integration tests.
tinybus = { workspace = true, features = ["test-support"] }
tokio = { workspace = true }
# The GitHub release verifier passes an explicit empty module configuration.
serde_json = { workspace = true }

[features]
default = []

[lints]
workspace = true
